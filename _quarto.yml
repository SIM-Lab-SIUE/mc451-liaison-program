project:
  type: website
  title: "MC Research Methods: The Liaison Program"
  output-dir: docs
  render:
    - "*.qmd"
    - "modules/**/*.qmd"
    - "resources/*.qmd"
    - "!README.md"
    - "!**/README.md"
    - "!DEVELOPER_GUIDE.md"
    - "!ARCHITECTURE.md"
    - "!DEPLOYMENT.md"
    - "!GIT_WORKFLOW.md"
    - "!GITHUB_SETUP.md"
    - "!CUSTOMIZATION_GUIDE.md"
    - "!ROADMAP.md"
    - "!TESTING_CHECKLIST.md"
    - "!CONTENT_PLAN.md"
    - "!DOCUMENTATION_*.md"
    - "!PROJECT_HANDOFF_SUMMARY.md"
    - "!HANDOFF_COMPLETION_REPORT.md"
    - "!QUICK_START.md"
    - "!START_HERE.md"
    - "!LAUNCH_CHECKLIST.md"
    - "!UX_IMPROVEMENT_PLAN.md"

website:
  title: "MC Research Methods: The Liaison Program"
  navbar:
    background: primary
    left:
      - text: "Home"
